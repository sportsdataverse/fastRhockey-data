<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    fastRhockey-data social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold divider + diamond that every card in
    the family shares. Generated by make_cards.py; edit the config there and
    re-render rather than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2E4A"/>
      <stop offset="100%" stop-color="#0A1424"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <g opacity="0.45">
    <g stroke="#4A6791" stroke-width="8" fill="none" stroke-linecap="round">
    <rect x="60" y="55" width="1160" height="530" rx="120"/>
    <path d="M400,55 V585"/><path d="M880,55 V585"/>
    <circle cx="640" cy="320" r="92"/>
    </g>
    <g stroke="#C9B6F0" stroke-width="7" fill="none">
    <path d="M640,55 V585"/>
    <circle cx="220" cy="175" r="62"/>
    <circle cx="220" cy="175" r="8" fill="#C9B6F0"/>
    <circle cx="220" cy="465" r="62"/>
    <circle cx="220" cy="465" r="8" fill="#C9B6F0"/>
    <circle cx="1060" cy="175" r="62"/>
    <circle cx="1060" cy="175" r="8" fill="#C9B6F0"/>
    <circle cx="1060" cy="465" r="62"/>
    <circle cx="1060" cy="465" r="8" fill="#C9B6F0"/>
    <path d="M60,250 A80,70 0 0 1 60,390"/>
    <path d="M1220,250 A80,70 0 0 0 1220,390"/>
    </g>
    <circle cx="640" cy="320" r="12" fill="#C9B6F0"/>
  </g>

  <text x="640" y="352" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="104" font-weight="700"
        stroke="#0A1424" stroke-width="16" paint-order="stroke"><tspan fill="#FFFFFF">fastRhockey</tspan><tspan fill="#C9B6F0">-data</tspan></text>

  <text x="640" y="430" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="30" font-weight="600" fill="#C9B6F0"
        letter-spacing="3">THE HOCKEY DATA RELEASES</text>

  <rect x="430" y="470" width="170" height="4" fill="#FFB612"/>
  <rect x="680" y="470" width="170" height="4" fill="#FFB612"/>
  <polygon points="640,454 658,472 640,490 622,472" fill="#FFB612"/>
  <text x="640" y="522" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="26" font-weight="400" fill="#8FA3B5"
        letter-spacing="2">fastRhockey.sportsdataverse.org</text>
</svg>
